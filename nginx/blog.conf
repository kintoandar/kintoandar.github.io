# nginx config for serving the generated site (the contents of _site/).
# Copy to /etc/nginx/conf.d/ (or sites-available/) and adjust server_name and root.

server {
    listen 80;
    listen [::]:80;
    server_name blog.kintoandar.com;

    root /var/www/blog;
    index index.html;

    # Posts are real files (/2018/01/slug.html), pages are folders (/posts/ -> /posts/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /feed.xml {
        default_type application/atom+xml;
    }

    # Assets keep their URLs between builds, so cache them for a while
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|css|woff2?|ttf|pdf|mp3)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML always revalidates so new posts show up straight away
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/atom+xml application/xml image/svg+xml;
}
