name: Release

# A tag (v1.0.0, ...) builds the site and attaches it as a zip to a GitHub
# release. The self-hosted copy (xinfra) pins the tag and the zip's sha256,
# which the release notes print. GitHub Pages keeps deploying from master.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache
          key: build-cache-${{ hashFiles('static/images/**', 'lib/**', 'theme/fonts/**') }}
          restore-keys: build-cache-
      - run: npm run build
      - name: Zip the site
        id: zip
        run: |
          asset="blog-kintoandar-${GITHUB_REF_NAME}.zip"
          (cd _site && zip -qrX "../$asset" . -x CNAME)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.asset }}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Built site for blog.kintoandar.com.

          asset: ${{ steps.zip.outputs.asset }}
          sha256: ${{ steps.zip.outputs.sha256 }}"
